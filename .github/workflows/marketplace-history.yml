name: Marketplace native history

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: marketplace-native-history-production
  cancel-in-progress: false

jobs:
  catch-up:
    if: github.repository == 'gnars-dao/gnars.com' && github.ref == 'refs/heads/main' && vars.MARKETPLACE_INDEXER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Index finalized Base sales
        env:
          MARKETPLACE_INDEXER_DATABASE_URL: ${{ secrets.MARKETPLACE_INDEXER_DATABASE_URL }}
          MARKETPLACE_DATABASE_SSL_CA: ${{ secrets.MARKETPLACE_DATABASE_SSL_CA }}
          BASE_RPC: ${{ secrets.MARKETPLACE_INDEXER_BASE_RPC }}
          NEXT_PUBLIC_GNARS_MARKETPLACE_ADDRESS: "0xC35813d40961151c11C97cB9d67D0D25CD4Cc86e"
        run: >-
          node --import tsx scripts/marketplace-history-sync.ts
          0x8e304836e9a849749989c7e2c289c5a5afabeb2a9fc9e803a2bb6919ad36df9c
          100 2000
